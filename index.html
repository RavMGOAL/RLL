
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Demonlist</title>

<style>
body {
  margin: 0;
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #191e2b;
  padding: 25px;
  text-align: center;
}

header h1 {
  color: #8b78ff;
}

nav {
  padding: 15px;
  text-align: center;
  background: #242a3a;
}

nav a {
  color: white;
  margin: 12px;
  text-decoration: none;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 15px;
}

input {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  margin-bottom: 20px;
  background: #242a3a;
  color: white;
  border: 1px solid #414a60;
  border-radius: 8px;
}

.level {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 18px;
  margin-bottom: 10px;
  background: #1c2230;
  border-radius: 10px;
}

.rank {
  font-size: 25px;
  color: #9c8cff;
  font-weight: bold;
  min-width: 40px;
}

.level h3 {
  margin: 0 0 8px;
}

.level p {
  margin: 0;
  color: #aeb6c9;
}

</style>
</head>

<body>

<header>
  <h1>MY DEMONLIST</h1>
  <p>The hardest Geometry Dash levels</p>
</header>

<nav>
  <a href="#">Main List</a>
  <a href="#">Extended List</a>
  <a href="#">About</a>
</nav>

<main>
  <h2>Main List</h2>

  <input
    id="search"
    placeholder="Search for a level..."
    oninput="searchLevels()"
  >

  <div id="levels"></div>
</main>

<script>
const levels = [
  {
    rank: 1,
    name: "Example Level",
    creator: "Example Creator"
  },
  {
    rank: 2,
    name: "Another Level",
    creator: "Another Creator"
  },
  {
    rank: 3,
    name: "Hard Level",
    creator: "GD Player"
  }
];

function showLevels(list) {
  document.getElementById("levels").innerHTML =
    list.map(level => `
      <div class="level">
        <div class="rank">#${level.rank}</div>
        <div>
          <h3>${level.name}</h3>
          <p>by ${level.creator}</p>
        </div>
      </div>
    `).join("");
}

function searchLevels() {
  const query = document
    .getElementById("search")
    .value.toLowerCase();

  const filtered = levels.filter(level =>
    level.name.toLowerCase().includes(query) ||
    level.creator.toLowerCase().includes(query)
  );

  showLevels(filtered);
}

showLevels(levels);
</script>

</body>
</html>
